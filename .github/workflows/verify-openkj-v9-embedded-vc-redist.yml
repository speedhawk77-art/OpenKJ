name: Verify OpenKJ v9 installer embedded VC redistributable

on:
  workflow_dispatch:
  push:
    branches: [offline-remote-v9]
    paths:
      - .github/workflows/verify-openkj-v9-embedded-vc-redist.yml
      - community/windows/STAGE_OPENKJ_COMPLIANCE_CANDIDATE_V9.py
      - community/windows/AUDIT_CANDIDATE_IMPORTS_V9.py
      - community/windows/pe-audit-requirements.txt
      - community/windows/PROBE_GSTREAMER_CANDIDATE_V9.py
      - community/windows/VERIFY_TOOLCHAIN_RUNTIME_V9.py
      - community/windows/blue-h264.mp4.b64
      - community/windows/EXPERIMENT_CISCO_CODEC_V9.py
      - community/windows/VERIFY_INSTALLER_ROUNDTRIP_V9.py
      - community/windows/MAKE_SINGLE_FILE_INSTALLER.py
      - community/windows/PROBE_APPLICATION_HTTP_V9.py
      - community/windows/PROBE_SOFTWARE_OPENGL_V9.py
      - community/windows/VERIFY_QT_SOFTWARE_OPENGL_ORIGIN_V9.py
      - community/licenses/**
      - THIRD_PARTY_NOTICES.md
      - community/WINDOWS_DLL_REPLACEMENT_GUIDE_v9.md

permissions:
  contents: write

jobs:
  verify-embedded-runtime:
    if: github.repository == 'speedhawk77-art/OpenKJ'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify draft release and download its exact installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          data="$(gh api "repos/${GITHUB_REPOSITORY}/releases/421204266")"
          printf '%s' "$data" | jq -e '.draft==true and .published_at==null' >/dev/null
          id="$(printf '%s' "$data" | jq -r '.assets[] | select(.name=="OpenKJ-v9-Cleaned-Setup.exe") | .id')"
          test "$id" = '667394901' || { echo "Installer asset has changed"; exit 2; }
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > OpenKJ-v9-Cleaned-Setup.exe
          printf '%s  %s\n' 'bc35c24ef25529b86b90bd3f5a215603de3b283d590620ec58820e02f83421ef' 'OpenKJ-v9-Cleaned-Setup.exe' | sha256sum -c -
      - name: Download checksum-pinned Inno Setup 7 unpacker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # innounp 2.71.2 supports Inno Setup through 7.1.0.
          # Pin both the upstream revision and the downloaded archive bytes.
          $url = 'https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/032d64c782efc6b36766d8f9c3b1b2f042144a58/innounp-2/bin/innounp-2.zip'
          Invoke-WebRequest -Uri $url -OutFile innounp-2.zip
          $sha = (Get-FileHash innounp-2.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '10fce27b6344b7674d5625cc34afca1c88c12183d957c6d93e401097fa2556cd') {
            throw 'Inno unpacker archive checksum mismatch'
          }
          Expand-Archive -LiteralPath innounp-2.zip -DestinationPath unpacker
      - name: Inspect Inno Setup 7 embedded Microsoft redistributable with innounp
        shell: bash
        run: |
          set -euo pipefail
          echo 'Looking for the embedded VC++ redistributable in the Inno archive.'
          # -n rejects unsupported formats; -a includes duplicate file entries.
          ./unpacker/innounp.exe -v -a -b -n OpenKJ-v9-Cleaned-Setup.exe > listing.txt || { cat listing.txt; echo 'Unpacker failed; no conclusion about embedded redist.'; exit 3; }
          grep -Fi 'vc_redist.x64.exe' listing.txt || { echo 'No matching VC++ file in archive listing; inspect manually.'; exit 4; }
          mkdir extracted
          ./unpacker/innounp.exe -x -a -b -n -y -dextracted OpenKJ-v9-Cleaned-Setup.exe
          count="$(find extracted -type f -iname 'vc_redist.x64.exe' | wc -l)"
          test "$count" -eq 1 || { echo "Expected one redistributable; found $count"; exit 5; }
          path="$(find extracted -type f -iname 'vc_redist.x64.exe' -print -quit)"
          sha="$(sha256sum "$path" | awk '{print $1}')"
          bytes="$(stat -c%s "$path")"
          echo "Embedded Microsoft VC++ file size: $bytes bytes"
          echo "Embedded Microsoft VC++ SHA-256: $sha"
          test "$bytes" -eq 18731856 || { echo "Unexpected redist size"; exit 6; }
          test "$sha" = '843068991daaa1f73ad9f6239bce4d0f6a07a51f18c37ea2a867e9beca71295c' || { echo "EMBEDDED REDIST DOES NOT MATCH SIGNED VS2026 CANDIDATES"; exit 7; }
          echo 'PASS: Embedded vc_redist.x64.exe is byte-identical to Microsoft-signed VS2026 Community redistributable candidates.'
          echo 'NOTE: Valid Visual Studio licensing and use terms still apply.'
      - name: Stage separate notice and codec test candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/421204266")"
          printf '%s' "$release" | jq -e '.draft==true and .published_at==null' >/dev/null
          notice_name='OpenKJ-v9-Upstream-Notices-v2.zip'
          notice_count="$(printf '%s' "$release" | jq --arg name "$notice_name" '[.assets[] | select(.name==$name)] | length')"
          test "$notice_count" -eq 1
          notice_id="$(printf '%s' "$release" | jq -r --arg name "$notice_name" '.assets[] | select(.name==$name) | .id')"
          notice_sha="$(printf '%s' "$release" | jq -r --arg name "$notice_name" '.assets[] | select(.name==$name) | .digest' | sed 's/^sha256://')"
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${notice_id}" > upstream-notices.zip
          printf '%s  %s\n' "$notice_sha" upstream-notices.zip | sha256sum -c -
          rust_name='OpenKJ-v9-librsvg-Rust-Notices-v2.zip'
          test "$(printf '%s' "$release" | jq --arg name "$rust_name" '[.assets[] | select(.name==$name)] | length')" -eq 1
          rust_id="$(printf '%s' "$release" | jq -r --arg name "$rust_name" '.assets[] | select(.name==$name) | .id')"
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${rust_id}" > rust-notices.zip
          printf '%s  %s\n' 'ed4998c77dcd9f0d2a9378860579011f7c12ae781cd66ce84025c17299d43a3f' rust-notices.zip | sha256sum -c -
          python community/windows/STAGE_OPENKJ_COMPLIANCE_CANDIDATE_V9.py \
            --cleaned 'extracted/{app}' \
            --repo . \
            --vc-redist "$(find extracted -type f -iname 'vc_redist.x64.exe' -print -quit)" \
            --out candidate \
            --notice-supplement upstream-notices.zip \
            --rust-notice-supplement rust-notices.zip \
            --omit-openh264
      - name: Record candidate preparation result
        shell: python
        run: |
          import json, os
          from pathlib import Path
          d = json.loads(Path('candidate/CANDIDATE-BUILD-EVIDENCE-v9.json').read_text())
          assert d['source_runtime_binary_count'] == 340
          assert d['candidate_runtime_binary_count'] == 338
          assert d['binary_hashes_unchanged_except_omissions'] is True
          assert d['release_approved'] is False
          text = (
              '### Separate test candidate prepared\n\n'
              '- Embedded Microsoft runtime: exact SHA-256 and size verified.\n'
              '- Retained program binaries: 338, all original hashes unchanged.\n'
              '- Removed for testing: libopenh264-7.dll and gst-plugins/libgstopenh264.dll.\n'
              f"- Supplemental source notice files added: {d['extra_source_notice_texts']}.\n"
              f"- Additional archive-derived notice files: {d['archive_derived_notice_files']}.\n"
              f"- Original Rust crate legal documents added: {d['rust_crate_notice_files']}.\n"
              f"- Total candidate notice files: {len(d['candidate_notice_sha256'])}.\n"
              '- Physical playback and corresponding-source review remain pending; later steps test the rebuilt installer.\n'
              '- Candidate binaries stay on this temporary runner; no release assets are changed.\n'
          )
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(text)
      - name: Install checksum-pinned static PE parser
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r community/windows/pe-audit-requirements.txt
      - name: Inspect retained binaries for imports of omitted OpenH264 components
        shell: bash
        run: |
          set -euo pipefail
          python community/windows/AUDIT_CANDIDATE_IMPORTS_V9.py \
            --original 'extracted/{app}' --candidate candidate \
            --report audit-reports/OpenKJ-v9-Candidate-Import-Audit.json
      - name: Probe isolated GStreamer media pipelines
        shell: bash
        run: |
          set -euo pipefail
          python community/windows/PROBE_GSTREAMER_CANDIDATE_V9.py \
            --candidate candidate --fixture community/windows/blue-h264.mp4.b64 \
            --report audit-reports/OpenKJ-v9-GStreamer-Probes.json
      - name: Identify the packaged software OpenGL renderer
        shell: bash
        run: |
          python community/windows/PROBE_SOFTWARE_OPENGL_V9.py --candidate candidate \
            --report audit-reports/OpenKJ-v9-Software-OpenGL-Probe.json
      - name: Compare software renderer with the exact Qt-published reference
        shell: bash
        run: |
          python community/windows/VERIFY_QT_SOFTWARE_OPENGL_ORIGIN_V9.py \
            --candidate candidate --work qt-renderer-reference \
            --report audit-reports/OpenKJ-v9-Software-OpenGL-Origin.json
      - name: Match GNU runtime DLLs to pinned compiler toolchains
        shell: bash
        run: |
          set -euo pipefail
          python community/windows/VERIFY_TOOLCHAIN_RUNTIME_V9.py \
            --candidate candidate --cache toolchain-cache \
            --report audit-reports/OpenKJ-v9-Toolchain-Runtime-Audit.json
      - name: Experiment with separately downloaded official Cisco codec
        shell: bash
        run: |
          set -euo pipefail
          python community/windows/EXPERIMENT_CISCO_CODEC_V9.py \
            --candidate candidate --original 'extracted/{app}' \
            --output cisco-experiment --fixture community/windows/blue-h264.mp4.b64 \
            --report audit-reports/OpenKJ-v9-Cisco-Compatibility-Experiment.json
      - name: Build and verify a separate test installer on the isolated runner
        shell: bash
        run: |
          set -euo pipefail
          python community/windows/VERIFY_INSTALLER_ROUNDTRIP_V9.py \
            --candidate candidate --work installer-roundtrip --unpacker unpacker/innounp.exe \
            --report audit-reports/OpenKJ-v9-Installer-Roundtrip.json
      - name: Probe installed application startup and localhost HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          python community/windows/PROBE_APPLICATION_HTTP_V9.py \
            --app installer-roundtrip/installed/openkj.exe \
            --report audit-reports/OpenKJ-v9-Installed-App-HTTP-Probe.json
      - name: Preserve text audit evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenKJ-v9-Candidate-Import-Audit
          path: audit-reports/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve successful text evidence in the unchanged draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from pathlib import Path
          import zipfile
          files=sorted(Path('audit-reports').glob('*.json'))+[Path('candidate/CANDIDATE-BUILD-EVIDENCE-v9.json')]
          assert files and all(p.is_file() and p.suffix=='.json' for p in files)
          with zipfile.ZipFile('remote-audit-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.name)
          PYCODE
          name="OpenKJ-v9-Remote-Audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          expected="sha256:$(sha256sum remote-audit-evidence.zip | awk '{print $1}')"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/421204266")"
          printf '%s' "$release" | jq -e --arg name "$name" '.draft==true and .published_at==null and ([.assets[]|select(.name==$name)]|length)==0' >/dev/null
          curl -fLsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Content-Type: application/zip' \
            --data-binary @remote-audit-evidence.zip "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/421204266/assets?name=${name}" > uploaded-audit.json
          jq -e --arg pin "$expected" '.digest==$pin and .state=="uploaded"' uploaded-audit.json >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/421204266" | jq -e --arg name "$name" --arg pin "$expected" '.draft==true and .published_at==null and ([.assets[]|select(.name==$name and .digest==$pin)]|length)==1' >/dev/null

name: Preserve identified Mesa and LLVM source and notices
on:
  workflow_dispatch:
  push:
    branches: [offline-remote-v9]
    paths:
      - .github/workflows/mirror-openkj-v9-graphics-sources.yml
      - community/windows/MIRROR_SOFTWARE_OPENGL_SOURCES_V9.py
permissions:
  contents: write
jobs:
  graphics-sources:
    if: github.repository == 'speedhawk77-art/OpenKJ'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and preserve upstream source archives
        run: python3 community/windows/MIRROR_SOFTWARE_OPENGL_SOURCES_V9.py --output graphics-source-output
      - name: Add graphics sources to the unchanged draft
        shell: bash
        run: |
          set -euo pipefail
          for name in OpenKJ-v9-Software-OpenGL-Sources.zip OpenKJ-v9-Software-OpenGL-Source-Manifest.json; do
            file="graphics-source-output/$name"
            expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
            release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/421204266")"
            printf '%s' "$release" | jq -e '.draft==true and .published_at==null' >/dev/null
            count="$(printf '%s' "$release" | jq --arg name "$name" '[.assets[] | select(.name==$name)] | length')"
            if [ "$count" -eq 0 ]; then
              curl -fLsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Content-Type: application/octet-stream' \
                --data-binary "@$file" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/421204266/assets?name=${name}" > uploaded-graphics.json
              jq -e --arg pin "$expected" '.digest==$pin and .state=="uploaded"' uploaded-graphics.json >/dev/null
            elif [ "$count" -eq 1 ]; then
              actual="$(printf '%s' "$release" | jq -r --arg name "$name" '.assets[] | select(.name==$name) | .digest')"
              test "$actual" = "$expected" || { echo 'Conflicting existing graphics source asset'; exit 2; }
            else
              exit 3
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/421204266" | jq -e --arg name "$name" --arg pin "$expected" '.draft==true and .published_at==null and ([.assets[] | select(.name==$name and .digest==$pin)]|length)==1' >/dev/null
          done

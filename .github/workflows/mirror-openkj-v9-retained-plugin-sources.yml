name: Preserve retained GStreamer plugin sources and notices
on:
  workflow_dispatch:
  push:
    branches: [offline-remote-v9]
    paths:
      - .github/workflows/mirror-openkj-v9-retained-plugin-sources.yml
      - community/windows/MIRROR_RETAINED_PLUGIN_SOURCES_V9.py
      - community/windows/data/plugin-*-v9.json
concurrency:
  group: openkj-v9-retained-plugin-mirror
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  plugin-sources:
    if: github.repository == 'speedhawk77-art/OpenKJ'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mirror sources without executing Rust or Cargo build scripts
        run: python3 community/windows/MIRROR_RETAINED_PLUGIN_SOURCES_V9.py --output plugin-source-output
      - name: Preserve registry sources and legal texts in the same draft
        shell: bash
        run: |
          set -euo pipefail
          for name in OpenKJ-v9-Retained-Plugin-Sources.zip OpenKJ-v9-Retained-Plugin-Source-Manifest.json OpenKJ-v9-Retained-Plugin-Notices.zip; do
            file="plugin-source-output/$name"
            expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
            release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/421204266")"
            printf '%s' "$release" | jq -e '.draft==true and .published_at==null' >/dev/null
            count="$(printf '%s' "$release" | jq --arg name "$name" '[.assets[] | select(.name==$name)]|length')"
            if [ "$count" -eq 0 ]; then
              curl -fLsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H 'Content-Type: application/octet-stream' \
                --data-binary "@$file" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/421204266/assets?name=${name}" > uploaded-cargo.json
              jq -e --arg pin "$expected" '.digest==$pin and .state=="uploaded"' uploaded-cargo.json >/dev/null
            elif [ "$count" -eq 1 ]; then
              actual="$(printf '%s' "$release" | jq -r --arg name "$name" '.assets[] | select(.name==$name)|.digest')"
              test "$actual" = "$expected" || { echo 'Conflicting existing retained-plugin source asset'; exit 2; }
            else
              exit 3
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/421204266" | jq -e --arg name "$name" --arg pin "$expected" '.draft==true and .published_at==null and ([.assets[]|select(.name==$name and .digest==$pin)]|length)==1' >/dev/null
          done

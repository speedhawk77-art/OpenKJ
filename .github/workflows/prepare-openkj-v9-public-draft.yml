name: Prepare clean public-release draft
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful documentation-refresh installer verification run ID
        type: string
        required: true
  workflow_run:
    workflows: ['Verify source-built OpenKJ v9 installer candidate']
    types: [completed]
    branches: [offline-remote-v9]
concurrency:
  group: openkj-v9-clean-public-draft
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    if: github.repository == 'speedhawk77-art/OpenKJ' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify evidence and prepare a separate draft without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ github.event.workflow_run.id || inputs.candidate_run }}
        run: python3 community/windows/PREPARE_PUBLIC_DRAFT_V9.py --candidate-run "$CANDIDATE_RUN" --work public-draft-inputs
